services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${OPEN_TAVERN_BIND_IP:-127.0.0.1}:8000:8000"
    environment:
      # Optional: pass through when set. Backend starts without it; OpenAI
      # features return 503 until a key is supplied.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPEN_TAVERN_DB=/data/open_tavern.db
      - OPEN_TAVERN_ALLOWED_ORIGINS=${OPEN_TAVERN_ALLOWED_ORIGINS:-http://localhost:5173}
      # Container listens on all interfaces so the frontend container can reach
      # it over the docker network. The host port above binds to
      # ${OPEN_TAVERN_BIND_IP} (default 127.0.0.1, localhost-only). Set
      # OPEN_TAVERN_BIND_IP to a LAN/tailnet IP to expose the API directly.
      - OPEN_TAVERN_BIND_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/sessions', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - backend-data:/data:Z

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BASE: /
        VITE_PWA_NAME: Open Tavern
    restart: unless-stopped
    ports:
      - "${OPEN_TAVERN_BIND_IP:-127.0.0.1}:5173:5173"
    environment:
      - OPEN_TAVERN_PROXY_TARGET=http://backend:8000
      - VITE_BASE=/
      - VITE_PWA_NAME=Open Tavern
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
