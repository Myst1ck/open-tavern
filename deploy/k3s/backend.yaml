apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-tavern-data
  namespace: home
  labels:
    app.kubernetes.io/name: open-tavern
    app.kubernetes.io/component: backend
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-tavern-backend
  namespace: home
  labels:
    app.kubernetes.io/name: open-tavern
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: open-tavern
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-tavern
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: localhost/open-tavern_backend:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OPEN_TAVERN_DB
              value: /data/open_tavern.db
            - name: OPEN_TAVERN_BIND_HOST
              value: 0.0.0.0
            - name: OPENAI_BASE_URL
              value: https://api.openai.com/v1
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: open-tavern-openai
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: open-tavern-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /sessions
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /sessions
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: open-tavern-data
          persistentVolumeClaim:
            claimName: open-tavern-data
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: home
  labels:
    app.kubernetes.io/name: open-tavern
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: open-tavern
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
