apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-tavern-frontend
  namespace: home
  labels:
    app.kubernetes.io/name: open-tavern
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-tavern
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-tavern
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: localhost/open-tavern_frontend:tavern
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: OPEN_TAVERN_PROXY_TARGET
              value: http://backend:8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5173
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: home
  labels:
    app.kubernetes.io/name: open-tavern
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: open-tavern
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 5173
      targetPort: 5173
