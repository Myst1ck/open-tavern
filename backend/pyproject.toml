[project]
name = "open-tavern"
version = "0.1.0"
description = "Open-source AI text RPG — Old Greg's Tavern style"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_tavern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
