stages: [test, build, deploy]

variables:
  BACKEND_IMAGE: localhost/open-tavern_backend:latest
  FRONTEND_IMAGE: localhost/open-tavern_frontend:tavern
  PROD_URL: https://slave.tail7c13f3.ts.net/tavern

test:
  stage: test
  script:
    - cd backend
    - uv sync --extra dev
    - uv run pytest -q
  allow_failure: false

build-images:
  stage: build
  # TODO(unverified): needs a buildah/podman-capable image and rootless storage config inside the
  # runner. Real intent: podman build ./backend -> $BACKEND_IMAGE and
  # podman build --build-arg VITE_BASE=/tavern/ ./frontend -> $FRONTEND_IMAGE (subpath arg mandatory).
  script:
    - echo "UNVERIFIED: image build inside rootless-podman runner not exercised yet. See comments above and deploy/k3s/README.md."
  allow_failure: true

deploy-prod:
  stage: deploy
  environment:
    name: production
    url: https://slave.tail7c13f3.ts.net/tavern
  # UNVERIFIED: runner (rootless podman container) has no confirmed sudo for
  # `k3s ctr images import` nor kubectl against the home namespace. Treat as a
  # documented manual step: build -> podman save | sudo k3s ctr images import -
  # -> kubectl -n home rollout restart deploy/open-tavern-backend / -frontend
  # -> kubectl -n home rollout status ... -> curl $PROD_URL (expect 200).
  script:
    - echo "UNVERIFIED runner permissions (sudo k3s ctr / kubectl). Manual flow: .omp/commands/deploy-prod.md + deploy/k3s/README.md. This job must not gate merges."
